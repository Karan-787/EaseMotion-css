<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Notification Badge - EaseMotion CSS Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="demo-container">
        <!-- Badge Showcase Card -->
        <div class="badge-card">
            <h2>Glassmorphism Badge</h2>
            <p>Hover or view the animated floating status and notification counts.</p>
            
            <div class="badge-examples">
                <!-- Example 1: Icon with floating count badge -->
                <div class="badge-wrapper">
                    <button class="icon-button" aria-label="Notifications">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        <span class="ease-badge ease-badge-pulse">3</span>
                    </button>
                    <span class="label-text">Inbox Count</span>
                </div>

                <!-- Example 2: Avatar with online status dot -->
                <div class="badge-wrapper">
                    <div class="avatar-container">
                        <div class="avatar">JD</div>
                        <span class="ease-badge ease-badge-dot ease-badge-pulse"></span>
                    </div>
                    <span class="label-text">User Status</span>
                </div>

                <!-- Example 3: Static label badge -->
                <div class="badge-wrapper">
                    <div class="button-badge-anchor">
                        <button class="action-btn">Messages</button>
                        <span class="ease-badge">New</span>
                    </div>
                    <span class="label-text">Status Tag</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
